services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PORT=8080
      - LICHESS_API_BASE=https://lichess.org/api
      - STOCKFISH_PATH=/usr/games/stockfish
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # Server-side (Node): reach the api container directly
      - API_INTERNAL_URL=http://api:8080
      # Client-side (browser): reach the api via the exposed host port
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
